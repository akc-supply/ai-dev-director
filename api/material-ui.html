<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자재관리</title>
<!--
  파일명: api/material-ui.html
  목적: [자재관리 · v0.53.0] 업무 › 자재관리 화면 (본 화면의 안쪽 창 /apps/material/).
    · 위쪽 가로 메뉴 : BOM 관리(PRICE HUB) 와 같은 딥틸 · 민트 작업표시줄 모양
    · 색 · 카드 · 표 · 상태 배지 · 상세 창 : 수입자재_결품경보 시안을 따른다
    · 계산 : 서버(api/material.js)가 준 재료로 기준일마다 다시 계산한다 (추정 재고 · 소진 예상일 · 발주 권장일 · 완성품 영향)
-->
<style>
:root{
  --side:#0E3B43; --side2:#124A53; --sideLine:#1C5A63;
  --teal:#0F766E; --teal2:#119383; --tealL:#E3F4F1; --tealT:#0B5F58;
  --bg:#F2F5F8; --card:#FFFFFF; --line:#E3E8EF; --line2:#EEF1F5; --head:#F7F9FB;
  --text:#1E293B; --text2:#5B6577; --muted:#94A0B2;
  --red:#E5484D; --redL:#FDECEC; --redT:#C62828;
  --org:#F27B2E; --orgL:#FFF0E5; --orgT:#D9650F;
  --amb:#F2B33D; --ambL:#FFF6DF; --ambT:#9A6400;
  --grn:#22A06B; --grnL:#E3F6EC; --grnT:#157347;
  --blu:#3B82F6; --bluL:#E8F0FE; --bluT:#1D4ED8;
  --ind:#5B5BD6; --gray:#EEF1F4; --grayT:#6B7280;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Pretendard Variable","Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:13px}
button,input,select{font-family:inherit;font-size:13px}
svg.i{width:16px;height:16px;flex:none}
/* ---------- 위쪽 가로 메뉴 (BOM 관리와 같은 모양) ---------- */
#topbar{position:sticky;top:0;z-index:30;height:48px;display:flex;background:linear-gradient(90deg,#16465d 0%,#1a6570 100%);border-bottom:1px solid rgba(102,226,206,.18);box-shadow:0 4px 14px rgba(11,40,54,.18)}
#topbar .in{width:100%;max-width:1700px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 18px}
.brand{display:flex;align-items:center;gap:8px;margin-right:8px;flex:none}
.brand .bx{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#66e2ce}
.brand b{color:#fff;font-weight:900;font-size:15px;letter-spacing:-.2px;white-space:nowrap}
.brand b span{color:#66e2ce}
#nav{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.nav-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.82);font-weight:700;font-size:13.5px;white-space:nowrap;cursor:pointer;transition:all .2s}
.nav-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.nav-btn.on{background:linear-gradient(45deg,#2dd4bf,#66e2ce);color:#0f3d4c;font-weight:800;box-shadow:0 4px 14px rgba(45,212,191,.4)}
.nav-btn .cnt{min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.nav-btn.on .cnt{background:#0f3d4c}
.tb-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;cursor:pointer}
.tb-btn:hover{background:rgba(255,255,255,.24)}
/* ---------- 본문 ---------- */
.main{max-width:1700px;margin:0 auto;padding:16px 22px 70px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.head h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px;color:#1E2B3C}
.head .sub{margin-top:6px;color:var(--text2);font-size:13px}
.btn-main{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:0 2px 6px rgba(15,118,110,.25)}
.btn-main:hover{background:#0C655E}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.accent{border-left:4px solid var(--teal)}
.fcard{display:flex;align-items:center;gap:14px;padding:11px 16px;margin-bottom:12px;flex-wrap:wrap}
.flabel{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--text)}
.flabel svg{color:var(--teal)}
.dbox{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:800;font-size:14px;color:var(--text);background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:800;color:var(--text2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--teal);color:#fff}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:800;border:1px solid;cursor:default}
.chip.ok{background:#E7F7EE;border-color:#9ADBB8;color:#146C43}
.chip.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:#146C43}
.chip.no{background:#F4F5F7;border-color:#DDE1E7;color:#8A93A3}
.chip.no::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid #A3ABB8}
.vline{width:1px;height:24px;background:var(--line)}
.meta{margin-left:auto;color:var(--text2);font-size:12px}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--text2);font-weight:700;cursor:pointer}
.warn{display:flex;align-items:flex-start;gap:9px;background:#FFFBEB;border:1px solid #F7D774;color:#7A4B00;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.warn svg{color:#B7791F;margin-top:2px}
.warn b{color:#5E3A00}
.info{display:flex;gap:9px;background:var(--tealL);border:1px solid #B5E3DA;color:var(--tealT);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{position:relative;padding:16px 18px 14px;cursor:pointer;border-left-width:4px;border-left-style:solid;transition:box-shadow .15s}
.kpi:hover{box-shadow:0 4px 14px rgba(16,24,40,.08)}
.kpi.active{box-shadow:0 0 0 2px rgba(15,118,110,.35)}
.kpi .k{font-weight:800;font-size:13px;color:#3C4657}
.kpi .v{font-size:28px;font-weight:900;margin-top:10px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .d{color:var(--muted);font-size:12px;margin-top:5px}
.kpi .ic{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.progs{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
.pc{padding:16px 18px}
.pc .row{display:flex;justify-content:space-between;align-items:center}
.pc .t{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:14px}
.pc .big{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.pc .bar{display:flex;height:9px;border-radius:99px;background:#E9EDF2;overflow:hidden;margin:12px 0 10px}
.pc .bar span{height:100%}
.pc .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.pc .lg b{color:var(--text)}
.tcard{overflow:hidden}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar .ttl{font-weight:900;font-size:15px}
.tbar .ttl small{color:var(--muted);font-weight:700;font-size:12px;margin-left:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search],.filters select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;color:var(--text)}
.filters input[type=search]{width:220px}
.filters select{max-width:220px}
/* [v0.53.4] 스크롤은 화면 하나로 : 표 안 세로 스크롤을 없애고, 머리줄은 화면 위쪽(메뉴 아래)에 붙는다
   넓은 화면은 표가 다 들어가므로 가로 스크롤도 없음 · 좁은 화면만 표를 옆으로 민다 */
.tbl-scroll{overflow-x:auto;overflow-y:visible}
@media (min-width:1280px){.tbl-scroll{overflow:visible}.tcard{overflow:visible}table thead th{top:48px}.tcard thead th:first-child{border-top-left-radius:0}.tcard .tbar{border-radius:12px 12px 0 0}}
table{border-collapse:separate;border-spacing:0;width:100%}
table.big{min-width:1150px}
thead th{position:sticky;top:0;z-index:2;background:var(--head);color:var(--text2);font-weight:800;font-size:12px;text-align:center;padding:10px 7px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th.nosort{cursor:default}
thead th .arr{color:var(--muted);font-size:10px;margin-left:3px}
tbody td{padding:9px 7px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums;font-size:12.5px}
tbody tr{background:#fff;cursor:pointer}
tbody tr:hover{background:#F8FAFB}
tbody tr.child td{background:#FAFBFC;padding-top:7px;padding-bottom:7px}
td.c{text-align:center} td.r{text-align:right} td.l{text-align:left}
.code{font-weight:800;color:var(--text)}
.name{color:var(--text2);max-width:230px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.sup{color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.date{color:var(--text2)} .num{color:var(--text2)} .bold{font-weight:800;color:var(--text)} .neg{color:var(--redT);font-weight:800} .muted{color:var(--muted)}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--teal);cursor:pointer}
.dd{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:20px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:900;margin-left:6px;vertical-align:middle}
.dd.red{background:var(--red);color:#fff} .dd.yel{background:#FDE68A;color:#8A5A00} .dd.gry{background:var(--gray);color:var(--grayT)}
.pill{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:900;white-space:nowrap}
.pill.red{background:#D92D20;color:#fff;box-shadow:0 1px 2px rgba(217,45,32,.3)} .pill.org{background:#F79009;color:#fff} .pill.yel{background:#FEF0C7;color:#93370D;border:1px solid #FEC84B} .pill.grn{background:var(--grnL);color:var(--grnT)} .pill.gry{background:var(--gray);color:var(--grayT)}
.pill svg{width:13px;height:13px}
.rg{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 5px;vertical-align:middle}
.rg.inf{background:#FFF0E5;color:#D9650F}
.rg.vf{background:#EEF2FF;color:#4338CA}
.rg.kgm{background:#ECFDF5;color:#047857}
.dbox.grp{font-size:13px;font-weight:800;max-width:300px;cursor:pointer}
.rg.ovs{background:var(--bluL);color:var(--bluT)} .rg.dom{background:var(--gray);color:var(--grayT)}
.via{display:inline-block;margin-left:6px;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@keyframes flash2{0%{opacity:1}18%{opacity:.15}36%{opacity:1}54%{opacity:.15}72%{opacity:1}100%{opacity:1}}
body.flash .blink{animation:flash2 .8s ease-in-out}
.cov{display:inline-flex;align-items:center;gap:8px}
.cov .track{width:100px;height:8px;border-radius:99px;background:#EDF0F5;overflow:hidden;display:flex}
.cov .ok{background:var(--grn)} .cov .bad{background:var(--red)}
.bn{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.3}
.bn small{color:var(--muted)}
.exp{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;width:22px}
.exp.open{color:var(--teal)}
/* 주간 영향 칸 */
.wk{display:inline-flex;gap:3px}
.wk i{display:inline-grid;place-items:center;width:40px;height:22px;border-radius:5px;font-style:normal;font-size:10.5px;font-weight:800;color:#fff}
.wk i.g{background:#C9EBD8;color:#146C43} .wk i.y{background:#FDE68A;color:#8A5A00} .wk i.r{background:var(--red)} .wk i.o{background:var(--org)} .wk i.n{background:var(--gray);color:var(--muted)}
.wkh{display:inline-flex;gap:3px} .wkh span{width:40px;text-align:center;font-size:10.5px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);flex-wrap:wrap;background:#fff}
.pager:empty{display:none}
.pgi{color:var(--text2);font-size:12px}
.pgn{display:inline-flex;gap:4px;flex-wrap:wrap}
.pgb{min-width:32px;height:30px;padding:0 8px;border:1px solid var(--line);background:#fff;border-radius:7px;font-weight:800;color:var(--text2);cursor:pointer}
.pgb:hover:not(:disabled){background:var(--head)}
.pgb.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pgb:disabled{opacity:.4;cursor:default}
.pgd{padding:0 4px;color:var(--muted);align-self:center}
.pgs{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff;color:var(--text2);font-weight:700}
.pd-head{display:flex;align-items:center;gap:16px;padding:14px 16px;margin-bottom:12px;flex-wrap:wrap;position:sticky;top:52px;z-index:25;box-shadow:0 6px 16px rgba(16,24,40,.08)}
.pd-back{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:800;color:var(--tealT);cursor:pointer;white-space:nowrap}
.pd-back:hover{background:var(--tealL)}
.pd-title .sub{color:var(--text2);margin-top:4px;font-size:13px}
.pd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px}
tr.bad-row td{background:#FFF7F7}
.chart.empty{padding:30px;text-align:center;color:var(--muted)}
/* 소진 예상 (옅은 바탕) */
.when{display:inline-flex;align-items:center;gap:6px}
.when b{font-weight:700;color:var(--text)}
.sx{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:800;white-space:nowrap}
.sx.crit{background:#FDECEC;color:#B42318}.sx.warn{background:#FFF0E5;color:#C4520A}.sx.mid{background:#FFF6DF;color:#8A5A00}.sx.calm{background:#EEF1F4;color:#5B6577}
/* 발주 권장 (테두리 + 시계) */
.ob{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:800;white-space:nowrap;border:1.5px solid;background:#fff}
.ob svg{width:12px;height:12px}
.ob.crit{border-color:#E5484D;color:#B42318}.ob.late{border-color:#D9650F;color:#B54708}.ob.soon{border-color:#93C5FD;color:#1D4ED8}
.ob.ordd{border-color:#5EEAD4;background:#F0FDFA;color:#0F766E}.obs{display:block;margin-top:3px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}.obs.warn-t{color:#B54708}   /* [v0.53.98] 발주 완료 */
/* 주별 소진 달력 */
.wkc{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:12px}
.wkb{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 0;cursor:pointer}
.wkb:hover{background:var(--head)}.wkb.on{border-color:var(--teal);background:var(--tealL)}
.wkn{font-size:12px;font-weight:900;color:var(--text);height:16px}
.wkbar{display:flex;flex-direction:column-reverse;width:60%;height:70px;background:#F1F4F8;border-radius:5px;overflow:hidden}
.wkbar .o{background:#3B82F6}.wkbar .d{background:#A3ABB8}
.wkl{font-size:11px;color:var(--text2);font-weight:700}.wki{font-size:10.5px;color:#D9650F;font-weight:800;height:14px}
.calc{display:block;max-width:190px;white-space:normal;line-height:1.3;color:var(--muted);font-size:11px;text-align:right}
/* 메일 알림 */
.ce{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:text}
.ce:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.ce.drop{border-color:var(--teal);border-style:dashed;background:var(--tealL)}
.ce input{flex:1;min-width:160px;border:0;outline:0;font-size:13px;padding:4px 2px;background:transparent}.ce input.bad{color:var(--redT)}
.ce-ch{display:inline-flex;align-items:center;gap:4px;background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3;border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:700;cursor:grab;max-width:100%}
.ce-ch.bad{background:#FEE4E2;border-color:#FDA29B;color:#B42318}
.ce-ch .t{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ce-ch small{color:#6366F1;font-weight:600;margin-left:5px}
.ce-ch button{border:0;background:transparent;color:#6366F1;cursor:pointer;font-size:13px;width:20px;height:20px;border-radius:50%}.ce-ch button:hover{background:#E0E7FF}
.ce-sug{position:absolute;left:6px;right:6px;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(16,24,40,.16);z-index:30;display:none;max-height:280px;overflow:auto}
.ce-o{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;font-size:12.5px}.ce-o span{color:var(--text2)}.ce-o small{color:var(--muted);font-size:11px}
.ce-o.on,.ce-o:hover{background:var(--tealL)}
.mpreset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
/* [v0.53.70] 묶음별 예약 · 받는 사람 접기 */
.msch{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msch-i{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;transition:border-color .15s,background .15s}
.msch-i.sel{border-color:var(--teal);background:var(--tealL)}.msch-i.off .msch-b{opacity:.45}
.msch-h{display:flex;align-items:center;gap:10px}.msch-h .t{flex:1;min-width:0;cursor:pointer}.msch-h .t b{display:block;font-size:13.5px;color:var(--text)}.msch-h .t small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msch-h .pv{flex:0 0 auto;width:16px;height:16px;accent-color:var(--teal);cursor:pointer}
.msch-b{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}

<script>
"use strict";
window.addEventListener("error", e => { const f = document.getElementById("foot"); if (f) f.insertAdjacentHTML("afterbegin", `<div style="color:#C62828;font-weight:800">화면 오류: ${String(e.message).replace(/</g,"&lt;")}</div>`); });
const ME = /*__ME__*/null;
/* ---------------- 공용 ---------------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = n => { if (n === null || n === undefined || isNaN(n)) return "—"; const v = Math.abs(n) >= 100 || Number.isInteger(Math.round(n*10)/10) ? Math.round(n) : Math.round(n*10)/10; return v.toLocaleString("ko-KR"); };
const won = n => (n === null || n === undefined || isNaN(n)) ? "—" : (Math.abs(n) >= 1e8 ? (Math.round(n/1e6)/100).toLocaleString("ko-KR") + "억" : Math.abs(n) >= 1e4 ? Math.round(n/1e4).toLocaleString("ko-KR") + "만" : Math.round(n).toLocaleString("ko-KR"));
const ico = (id, cls="i") => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const toUTC = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
const fromUTC = t => new Date(t).toISOString().slice(0,10);
const DAY = 86400000;
const diffDays = (a,b) => Math.round((toUTC(a)-toUTC(b))/DAY);
const addDays = (s,n) => fromUTC(toUTC(s)+n*DAY);

function aliasCands(pairs){
  const used = new Set(pairs.map(p => MMRules.partKey(p.from))), out = [];
  Object.values(MATS).forEach(t => {

}

   ② 이 브라우저(IndexedDB)에 저장해 둔 자재 · 완성품 중 지문이 같은 것은 그대로 쓰고, 바뀐 것만 새로 받는다
   ③ 그래서 바뀐 게 없으면 큰 자료를 받지 않고 바로 뜬다. 화면을 가리는 '불러오는 중' 은 처음 한 번(저장분이 없을 때)만 */
const IDB = { db: null };
function idbOpen(){ return new Promise(ok => { try { const r = indexedDB.open("akc-material", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(IDB.db = r.result); r.onerror = () => ok(null); } catch (e) { ok(null); } }); }
async function idbGet(k){ const db = IDB.db || await idbOpen(); if (!db) return null; return new Promise(ok => { try { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); } catch (e) { ok(null); } }); }
async function idbPut(k, v){ const db = IDB.db || await idbOpen(); if (!db) return; try { db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch (e) {} }
function topProg(on, txt){ const el = document.getElementById("topProg"); if (!el) return; el.classList.toggle("on", !!on); el.title = txt || ""; }
async function fetchModel(force, tries){
  const man = await api("api/manifest" + (force ? "?refresh=1" : ""));
  const local = (await idbGet("store")) || { mats: {}, prods: {} };
  const needM = man.m.filter(([k,h]) => !local.mats[k] || local.mats[k].h !== h).map(x => x[0]);
  const needP = man.p.filter(([k,h]) => !local.prods[k] || local.prods[k].h !== h).map(x => x[0]);
  let got = { m: [], p: [] };
  if (needM.length || needP.length) {
    const r = await fetch("api/items", { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ ver: man.ver, m: needM, p: needP }) });
    const j = await r.json().catch(() => null);
    if (r.status === 409 && (tries || 0) < 3) return fetchModel(false, (tries || 0) + 1);   // 그사이 바뀜 → 처음부터
    if (!r.ok || !j || !j.success) throw new Error((j && j.message) || ("서버 응답 " + r.status));
    got = j;
  }
  const hm = {}, hp = {}; man.m.forEach(([k,h]) => hm[k] = h); man.p.forEach(([k,h]) => hp[k] = h);
  const mats = {}, prods = {};
  man.m.forEach(([k,h]) => { if (local.mats[k] && local.mats[k].h === h) mats[k] = local.mats[k]; });
  man.p.forEach(([k,h]) => { if (local.prods[k] && local.prods[k].h === h) prods[k] = local.prods[k]; });
  got.m.forEach(d => mats[d.k] = { h: hm[d.k], d }); got.p.forEach(d => prods[d.k] = { h: hp[d.k], d });
  if (got.m.length || got.p.length || !local.ver || local.ver !== man.ver) idbPut("store", { ver: man.ver, at: Date.now(), mats, prods });   // 저장은 지금 모습 그대로 (계산용 칸을 붙이기 전)
  const M = Object.assign({}, man.meta, { ver: man.ver, materials: man.m.map(([k]) => Object.assign({}, mats[k].d)), products: man.p.map(([k]) => prods[k].d) });
  M._stat = { all: man.m.length + man.p.length, fetched: got.m.length + got.p.length };
  return M;
}
async function load(force){
  const t0 = performance.now();
  const hasLocal = !!(await idbGet("store"));
  topProg(true, "최신 자료 확인 중");
  const ov = document.getElementById("loading");
  const ovT = hasLocal && !force ? null : setTimeout(() => { ov.style.display = "flex"; }, hasLocal ? 0 : 150);
  try {
    MODEL = await fetchModel(force);
    await eolLoad();   /* [v0.53.72] 소진 후 단종 스위치 */
    buildDays(); MATS = {}; MODEL.materials.forEach(m => { m.eol = eolOn(m.k); prep(m); MATS[m.k] = m; });
    const a = document.getElementById("asof"); a.min = MODEL.baseDate; a.max = addDays(todayStr(), 180);
    if (S.tMode === "today") S.t = todayStr(); a.value = S.t;
    const sups = [...new Set(MODEL.materials.map(m => m.sup).filter(Boolean))].sort();
    fillSup();   /* [v0.53.58] 모든 매입처 고르개 (대시보드 · 자재관리 · 자재 현황 같은 값) */
    setBaseLabels(); RUN_PMAP = null; PREG = null; setTimeout(syncRegion, 0); tagGroups(); tagCust(); renderChips();
    /* [v0.53.37] 모델을 받을 때마다 입고 · 재고 기록 목록도 새로 받아(다른 사람 · 다른 창이 넣은 것 포함) 아직 서버에 안 간 변경을 얹은 뒤 다시 셈
       → 서버 모델이 옛것이든 새것이든 화면 값은 「서버 기록 + 기다리는 변경」 하나로 정해진다 (되돌아가 보이는 일 없음) */
    try { await runLoadInb(); } catch (e) {}
    frLoad().then(() => { if (S.tab === "free") renderFree(); else if (S.tab === "run") { if (runInit().open) runKeep(); else renderRun(); } });   /* [v0.53.104] 무상출고 요청 (메뉴 배지 · 자재관리 꼬리표) */
    recompute(); fillGrp(); fillCust(); routeHash();
    const st = MODEL._stat, ms = Math.round(performance.now() - t0);
    document.getElementById("meta").insertAdjacentHTML("beforeend", ` · <span title="자재 · 완성품 ${nf(st.all)}건 중 새로 받은 것 ${nf(st.fetched)}건 · ${ms}ms">${st.fetched ? "새로 받음 " + nf(st.fetched) + "건" : "변경 없음"}</span>`);
    document.getElementById("foot").innerHTML = `<details class="footd"><summary>계산 기준 · 자료 버전</summary><div>기준점 = 재무회계팀 ${MODEL.baseDate} 수불부 기말 재고 (100% 기준 · 여유율 없음). 사용량 = 생산실적 × BOM (~${MODEL.actEnd}) + 생산계획 × BOM (이후) · BOM 이 없는 자재는 ${BM} 수불부 출고 ÷ ${MODEL.baseDays || 31}일 · 상품은 상품매출. 입고 = MES 매입 (반품은 빼고, ${MMRules.EXCLUDED.join(" · ")} 은 넣지 않음 · 확정 전 상태는 「확인 대기」로 표시). 리드타임은 품목 기준표 납기가능일자 (없으면 해외 60일 · 국내 30일, * 표시). 화면에 적은 입고 확인 · 입고 예정은 MES 매입과 자동으로 맞춰 두 번 세지 않습니다. 자료 버전 ${esc(MODEL.ver || "")}.</div></details>`;
  } catch (e) {
    document.querySelector(".main").insertAdjacentHTML("afterbegin", `<div class="warn">${ico("warn")}<div><b>자료를 불러오지 못했습니다.</b><br>${esc(e.message)}</div></div>`);
  } finally { clearTimeout(ovT); ov.style.display = "none"; topProg(false); }
}
/* 화면을 다시 보게 되면(다른 탭에 갔다 오면) 조용히 최신인지 확인한다 — 바뀌었으면 바뀐 것만 받아 다시 그린다 */
let lastVer = null;
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !MODEL) return;
  try { const man = await api("api/manifest"); if (man.ver !== MODEL.ver) { const keep = window.scrollY; await load(false); window.scrollTo(0, keep); } } catch (e) {}
});
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#navToggle")) { const n = document.getElementById("nav"); n.classList.toggle("open"); document.getElementById("navOverlay").classList.toggle("on", n.classList.contains("open")); return; }
  if (t.id === "navOverlay") { document.getElementById("nav").classList.remove("open"); t.classList.remove("on"); return; }
  const dsb = t.closest("[data-dash]"); if (dsb) { S.dash = dsb.dataset.dash; S.page = {}; showPanes(); render(); window.scrollTo(0, 0); return; }
  const nav = t.closest(".nav-btn[data-tab]"); if (nav) { document.getElementById("navOverlay").classList.remove("on"); return setTab(nav.dataset.tab); }
  if (t.closest("#btnRefresh")) { Object.keys(RAW).forEach(k => delete RAW[k]); return load(true); }
  const ra = t.closest("[data-rawall]"); if (ra) { S.rawAll = ra.dataset.rawall === "1"; if (!S.rawAll) { S.supMonth = todayStr().slice(0, 7); S.flowMonth = todayStr().slice(0, 7); } S.page = {}; return render(); }
  if (t.closest("#btnExport")) return exportCsv();
  if (t.closest("#dx") || t.id === "dbg") return closeDrawer();
  const th = t.closest("th[data-sort]"); if (th && !th.classList.contains("nosort")) { S.page = {}; const [key, i] = th.dataset.sort.split(":"); const cur = S.sort[key]; S.sort[key] = { i: +i, d: cur && cur.i === +i ? -cur.d : 1 }; return render(); }
  const sg = t.closest("#segT button"); if (sg) { S.page = {}; S.tMode = sg.dataset.t; S.t = sg.dataset.t === "base" ? MODEL.baseDate : todayStr(); document.getElementById("asof").value = S.t; document.querySelectorAll("#segT button").forEach(b => b.classList.toggle("on", b === sg)); recompute(); return render(); }
  const sr = t.closest("#segR button"); if (sr) { S.page = {}; S.region = sr.dataset.r; syncRegion(); recompute(); return render(); }
  const ss = t.closest("#segSup button"); if (ss) { S.page = {}; S.supKind = ss.dataset.k; S.sort.sup = null; document.querySelectorAll("#segSup button").forEach(b => b.classList.toggle("on", b === ss)); return render(); }
  const sf = t.closest("#segFlow button"); if (sf) { S.page = {}; S.flowKind = sf.dataset.k; S.flowGb = ""; S.sort.flow = null; document.querySelectorAll("#segFlow button").forEach(b => b.classList.toggle("on", b === sf)); return render(); }
  /* [v0.53.5] 카드와 주 막대는 서로 다른 질문이라 하나를 고르면 다른 하나는 풀린다 (예전엔 둘이 겹쳐 0건이 나왔다)
     카드 숫자와 표 줄 수가 같게 : 카드를 누르면 상태 · 매입처 · 근거 · 검색 거르기도 함께 풀린다 */
  if (t.closest("#fpGo")) return runFind();
  const fq = t.closest("[data-fpq]"); if (fq) { const i = document.getElementById("fpQ"); if (i) i.value = fq.dataset.fpq; return runFind(); }
  const ak = t.closest("[data-augk]"); if (ak) { S.augK = ak.dataset.augk; S.augN = 10; return renderDiag(); }
  if (t.closest("[data-augmore]")) { S.augN = (S.augN || 10) + 20; return renderDiag(); }
  if (t.closest("[data-augless]")) { S.augN = 10; return renderDiag(); }
  const pg0 = t.closest("tr[data-pdg]"); if (pg0 && !t.closest("[data-pk]")) { S.pdOpen = S.pdOpen || {}; S.pdOpen[pg0.dataset.pdg] = !S.pdOpen[pg0.dataset.pdg]; return renderPD(); }   /* [v0.53.28] 생산계획 구간 펼치기 */
  const ka0 = t.closest(".kpi[data-act]"); if (ka0 && !t.closest("#kMod")) return kpiDetail("p:" + ka0.dataset.act);
  const kdc = t.closest(".kpi[data-kd]"); if (kdc) return kpiDetail(kdc.dataset.kd);
  const pst = t.closest("[data-pst]"); if (pst) { S.page = {}; S.stat = pst.dataset.pst; S.kpi = ""; const f = document.getElementById("fStat"); if (f) f.value = S.stat; return render(); }   /* [v0.53.97] 추천 상태 막대 */
  const ppst = t.closest("[data-ppst]"); if (ppst) { S.page = {}; S.pstat = ppst.dataset.ppst; const f = document.getElementById("fPStat"); if (f) f.value = S.pstat; return render(); }   /* [v0.53.97] 자재 현황 상태 막대 */
  const ka = t.closest("[data-kact]"); if (ka) { kClose(); S.page = {}; S.act = ka.dataset.kact; S.week = null; S.stat = ""; S.sup = ""; S.src = ""; S.q = ""; ["fStat","fSup","fSrc","qPart"].forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; }); return render(); }
  const wb = t.closest("[data-week]"); if (wb) { S.page = {}; const w = +wb.dataset.week; S.week = S.week === w ? null : w; S.act = ""; return render(); }
  const kp = t.closest(".kpi[data-kpi]"); if (kp) { S.page = {}; S.kpi = S.kpi === kp.dataset.kpi ? "" : kp.dataset.kpi; if (S.kpi === "영향") { S.kpi = ""; return setTab("prod"); } return render(); }
  const mlb = t.closest("[data-ml]"); if (mlb) return mailAct(mlb.dataset.ml);
  const psb = t.closest("[data-ps]"); if (psb) return pushAct(psb.dataset.ps);
  const pgb = t.closest("[data-pg]"); if (pgb && !pgb.disabled) { const [key, to] = pgb.dataset.pg.split(":"); S.page[key] = +to; render(); const sc = document.querySelector("#pane-" + (key === "part" ? "part" : key) + " .tbl-scroll"); if (sc) sc.scrollTop = 0; return; }
  const tg = t.closest("[data-toggle]"); if (tg) { const k = tg.dataset.toggle; S.open.has(k) ? S.open.delete(k) : S.open.add(k); return render(); }
  const pk = t.closest("[data-pk]"); if (pk) return partDrawer(pk.dataset.pk);
  const pr = t.closest("tr[data-part]"); if (pr) return partDrawer(pr.dataset.part);
  if (t.closest("[data-back]")) { backToList(); return; }
  const pp = t.closest("tr[data-prod]"); if (pp) return openProdPage(pp.dataset.prod);
  const su = t.closest("[data-sup]"); if (su) return supDrawer(su.dataset.sup);
  const fl = t.closest("[data-flow]"); if (fl) return flowDrawer(fl.dataset.flow);
});
const on = (id, ev, fn) => document.getElementById(id).addEventListener(ev, e => { S.page = {}; fn(e); });   // 거르기를 바꾸면 첫 쪽으로
let qt = null; const deb = fn => { clearTimeout(qt); qt = setTimeout(fn, 180); };
on("asof", "change", e => { if (!e.target.value) return; S.t = e.target.value; S.tMode = "date"; document.querySelectorAll("#segT button").forEach(b => b.classList.toggle("on", (b.dataset.t === "today" && S.t === todayStr()) || (b.dataset.t === "base" && S.t === MODEL.baseDate))); recompute(); render(); });
on("fJG", "change", e => { S.noJG = e.target.checked; recompute(); render(); });
on("fGoods", "change", e => { S.noGoods = e.target.checked; recompute(); render(); });
on("fGrp", "change", e => { S.grp = e.target.value; fillSup(); recompute(); render(); });
on("qPart", "input", e => deb(() => { S.q = e.target.value.trim(); render(); }));
/* [v0.53.58] 매입처 고르개는 아래 공통 처리 (select[data-sup]) */
on("fStat", "change", e => { S.stat = e.target.value; S.kpi = ""; render(); });
on("fSrc", "change", e => { S.src = e.target.value; render(); });
on("fActive", "change", e => { S.active = e.target.checked; render(); });
on("qProd", "input", e => deb(() => { S.qp = e.target.value.trim(); render(); }));
on("fLine", "change", e => { S.line = e.target.value; render(); });
on("fPStat", "change", e => { S.pstat = e.target.value; render(); });
on("fPlanOnly", "change", e => { S.planOnly = e.target.checked; render(); });
on("qBase", "input", e => deb(() => { S.qb = e.target.value.trim(); render(); }));
on("fSheet", "change", e => { S.sheet = e.target.value; render(); });

on("qSup", "input", e => deb(() => { S.qs = e.target.value.trim(); render(); }));

on("fFlowGb", "change", e => { S.flowGb = e.target.value; render(); });
/* [v0.53.97] [↺ 초기화] : 그 화면 거르기를 기본값으로 (구분 · 고객사는 모든 화면이 같은 값) */
const uiVal = (id, v) => { const el = document.getElementById(id); if (!el) return; if (el.type === "checkbox") el.checked = v; else el.value = v; };
function uiRegCust(){ const r = !!S.region; S.region = ""; S.cust = ""; syncRegion(); fillCust(); if (S.run) S.run.stat = ""; if (r) recompute(); }
on("partClr", "click", () => { S.q = ""; S.stat = ""; S.src = ""; S.active = true; S.kpi = ""; uiVal("qPart", ""); uiVal("fStat", ""); uiVal("fSrc", ""); uiVal("fActive", true); render(); });
on("prodClr", "click", () => { S.qp = ""; S.line = ""; S.pstat = ""; S.planOnly = true; uiVal("qProd", ""); uiVal("fLine", ""); uiVal("fPStat", ""); uiVal("fPlanOnly", true); render(); });
on("supClr", "click", () => { S.supMonth = todayStr().slice(0, 7); S.qs = ""; uiVal("qSup", ""); uiRegCust(); render(); });
on("flowClr", "click", () => { S.flowMonth = todayStr().slice(0, 7); S.flowGb = ""; S.qf = ""; uiVal("qFlow", ""); uiRegCust(); render(); });
on("qFlow", "input", e => deb(() => { S.qf = e.target.value.trim(); render(); }));
/* [v0.53.24] 자재 구분(해외 · 국내) — 모든 탭이 같은 값 (위 자재 재고 막대의 [전체 · 해외 · 국내] 와도 같음) */
function syncRegion(){ document.querySelectorAll("select[data-region]").forEach(el => { el.value = S.region || ""; }); document.querySelectorAll("#segR button").forEach(b => b.classList.toggle("on", (b.dataset.r || "") === (S.region || ""))); }
document.addEventListener("change", e => { if (e.target.matches && e.target.matches("select[data-region]")) { S.region = e.target.value; S.page = {}; syncRegion(); recompute(); render(); } });
document.addEventListener("change", e => { if (e.target.matches && e.target.matches("select[data-supsel]")) { S.sup = e.target.value; S.page = {}; fillSup(); if (S.run) S.run.stat = ""; render(); } });
document.addEventListener("change", e => { if (e.target.matches && e.target.matches("select[data-cust]")) { S.cust = e.target.value; S.page = {}; fillCust(); if (S.run) S.run.stat = ""; render(); } });
document.addEventListener("change", e => { if (e.target.matches && e.target.matches("[data-pgsize]")) { S.psize = +e.target.value || 50; S.page = {}; render(); } });
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (document.getElementById("drawer").classList.contains("on")) closeDrawer(); else if (S.detail) backToList(); });
setInterval(() => { document.body.classList.add("flash"); setTimeout(() => document.body.classList.remove("flash"), 900); }, 3000);
setTab("dash"); load(false);
